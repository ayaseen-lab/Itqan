<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none" role="img" aria-label="Itqan hero artwork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 150) rotate(90) scale(210 260)">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(610 115) rotate(90) scale(110 110)">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="geo" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M22 2 L42 22 L22 42 L2 22 Z" stroke="#a7f3d0" stroke-opacity="0.12" stroke-width="1" fill="none"/>
      <path d="M22 10 L34 22 L22 34 L10 22 Z" stroke="#a7f3d0" stroke-opacity="0.10" stroke-width="1" fill="none"/>
      <circle cx="22" cy="22" r="1.2" fill="#a7f3d0" fill-opacity="0.10"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" rx="24" fill="url(#bg)"/>
  <rect width="800" height="520" rx="24" fill="url(#glow1)"/>
  <rect width="800" height="520" rx="24" fill="url(#glow2)"/>
  <rect width="800" height="520" rx="24" fill="url(#geo)" opacity="0.85"/>

  <!-- Crescent -->
  <circle cx="640" cy="115" r="48" fill="url(#gold)" opacity="0.95"/>
  <circle cx="660" cy="115" r="40" fill="url(#bg)"/>

  <!-- Minimal mosque silhouette -->
  <path d="M170 418V320c0-8 4-14 12-18l78-40c10-5 22-5 32 0l78 40c8 4 12 10 12 18v98H170Z" fill="#34d399" fill-opacity="0.22"/>
  <path d="M330 418V270c0-10 6-18 16-24l54-32c14-8 30-8 44 0l54 32c10 6 16 14 16 24v148H330Z" fill="#34d399" fill-opacity="0.30"/>
  <rect x="386" y="286" width="28" height="132" rx="6" fill="#ecfdf5" fill-opacity="0.10"/>
  <rect x="416" y="286" width="28" height="132" rx="6" fill="#ecfdf5" fill-opacity="0.08"/>

  <!-- Soft horizon layer -->
  <path d="M70 390c80-70 160-30 240-55s140-70 240-30 150 10 180-20v120H70V390Z" fill="#10b981" fill-opacity="0.10"/>

  <!-- Calligraphy -->
  <text x="400" y="458" text-anchor="middle" fill="#ecfdf5" font-family="serif" font-size="44" opacity="0.92">%*B'F</text>
